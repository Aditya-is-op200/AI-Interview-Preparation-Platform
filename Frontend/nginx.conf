server {
    listen 80;

    # Serve the React SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend container.
    # This is what makes the frontend's hardcoded "http://localhost:3000" work
    # inside Docker — the browser talks to Nginx on :80, Nginx forwards /api
    # calls to the backend service on :3000 internally.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for cookies (withCredentials: true in Axios) to work
        proxy_pass_header  Set-Cookie;
    }

    # All other routes fall through to index.html (React Router support)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
